name: release

# Push a tag like v0.1.0 (matching lib/ruby_llm/claude_cli/version.rb) to publish.
on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write # create the GitHub release
      id-token: write # RubyGems trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
          bundler-cache: true
      - name: Tag matches gem version
        run: |
          version=$(ruby -Ilib -e 'require "ruby_llm/claude_cli/version"; print RubyLLM::ClaudeCLI::VERSION')
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != v$version"; exit 1; }
      - run: bundle exec rake test
      - uses: rubygems/configure-rubygems-credentials@v1.0.0
      - name: Build and push gem
        run: |
          gem build ruby_llm-claude_cli.gemspec
          gem push ruby_llm-claude_cli-*.gem
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" ruby_llm-claude_cli-*.gem --title "$GITHUB_REF_NAME" --notes-file CHANGELOG.md
